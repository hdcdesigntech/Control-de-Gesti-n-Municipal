                    </div>
                    
                    <div id="contenedor-obras" class="space-y-4">
                        </div>
                </div>
            </section>
        </div>

    </main>

    <div class="hidden print-only fixed bottom-10 left-0 w-full grid grid-cols-3 text-center text-[10px] uppercase font-black px-12">
        <div class="border-t border-black pt-2 mx-6">Coordinador de Campo</div>
        <div class="border-t border-black pt-2 mx-6">Dirección Ejecutiva</div>
        <div class="border-t border-black pt-2 mx-6">Alcaldía de Guacara</div>
    </div>

    <script>
        // ================= BASE DE DATOS LOCAL INICIALIZADA DE TRAYECTOS COMPLETA =================
        let tramosPostes = [
            { id: 1, categoria: "Autopista", segmento: "Entrada hasta Dist. Yagua", tipoPoste: "Poste Alumbrado", total: 12, pintados: 7 },
            { id: 2, categoria: "Autopista", segmento: "Tramo Dist. Yagua - Variante", tipoPoste: "Poste Alumbrado", total: 25, pintados: 12 },
            { id: 3, categoria: "Carretera Nacional", segmento: "Eje Guacara - Los Guayos", tipoPoste: "Poste de Baja Tensión", total: 40, pintados: 30 },
            { id: 4, categoria: "Avenidas Principales", segmento: "Avenida Piar (Eje Centro)", tipoPoste: "Poste Alumbrado", total: 18, pintados: 18 },
            { id: 5, categoria: "Espacios Estratégicos", segmento: "Alrededores Plaza de Yagua", tipoPoste: "Poste de Baja Tensión", total: 15, pintados: 0 }
        ];

        let proyectosObras = [
            {
                id: 1,
                titulo: "Recuperación e Iluminación de Cancha de Usos Múltiples",
                tipo: "Recuperación de Espacio",
                micros: [
                    { id: 501, nombre: "Saneamiento de brocales y cercado", cumplido: true },
                    { id: 502, nombre: "Aplicación de pintura de alto tráfico en losas", cumplido: false },
                    { id: 503, nombre: "Instalación de 4 reflectores LED industriales", cumplido: true }
                ]
            }
        ];

        function cambiarPortal(portal) {
            document.getElementById('portal-postes').classList.toggle('hidden', portal !== 'postes');
            document.getElementById('portal-actividades').classList.toggle('hidden', portal !== 'actividades');
            
            document.getElementById('nav-postes').className = portal === 'postes' ? 'active-tab px-4 py-2 rounded-lg text-xs font-bold transition-all flex items-center gap-2 uppercase' : 'px-4 py-2 rounded-lg text-xs font-bold text-slate-400 hover:text-white transition-all flex items-center gap-2 uppercase';
            document.getElementById('nav-actividades').className = portal === 'actividades' ? 'active-tab px-4 py-2 rounded-lg text-xs font-bold transition-all flex items-center gap-2 uppercase' : 'px-4 py-2 rounded-lg text-xs font-bold text-slate-400 hover:text-white transition-all flex items-center gap-2 uppercase';
        }

        function agregarNuevoTrayecto(e) {
            e.preventDefault();
            const categoria = document.getElementById('trayecto-categoria').value;
            const segmento = document.getElementById('trayecto-segmento').value.trim();
            const tipoPoste = document.getElementById('trayecto-tipo-poste').value;
            const total = parseInt(document.getElementById('trayecto-total').value) || 0;
            let pintados = parseInt(document.getElementById('trayecto-pintados').value) || 0;

            if (pintados > total) pintados = total;

            tramosPostes.push({ id: Date.now(), categoria, segmento, tipoPoste, total, pintados });

            document.getElementById('trayecto-segmento').value = "";
            document.getElementById('trayecto-total').value = "10";
            document.getElementById('trayecto-pintados').value = "0";

            calcularYRenderizarPostes();
        }

        function eliminarTrayecto(id) {
            tramosPostes = tramosPostes.filter(t => t.id !== id);
            calcularYRenderizarPostes();
        }

        function calcularYRenderizarPostes() {
            const tbody = document.getElementById('tabla-postes-body');
            tbody.innerHTML = "";

            let gTotal = 0, gPintados = 0, gPendientes = 0;
            let gAlumbrado = 0, gBaja = 0;
            let galNaranja = 0, galAzul = 0, galAluminio = 0, galNegro = 0;

            tramosPostes.forEach((tramo, index) => {
                let pendientes = tramo.total - tramo.pintados;
                let pct = tramo.total > 0 ? Math.round((tramo.pintados / tramo.total) * 100) : 0;
                
                let basePintura = Math.ceil(tramo.pintados / 4);
                let contrastePintura = Math.ceil(tramo.pintados / 8);
                let brochas = Math.ceil((tramo.pintados / 15) * 2);
                if (brochas < 1 && tramo.pintados > 0) brochas = 1;

                let lblBase = tramo.tipoPoste === "Poste Alumbrado" ? "Naranja" : "Aluminio";
                let lblContraste = tramo.tipoPoste === "Poste Alumbrado" ? "Azul" : "Negro";

                if (tramo.tipoPoste === "Poste Alumbrado") {
                    gAlumbrado += tramo.total;
                    galNaranja += basePintura;
                    galAzul += contrastePintura;
                } else {
                    gBaja += tramo.total;
                    galAluminio += basePintura;
                    galNegro += contrastePintura;
                }

                gTotal += tramo.total;
                gPintados += tramo.pintados;
                gPendientes += pendientes;

                tbody.innerHTML += `
                    <tr class="hover:bg-white/[0.02] border-b border-white/5 transition-all">
                        <td class="p-3 text-left font-black text-blue-400 text-[11px] uppercase tracking-wide">${tramo.categoria}</td>
                        <td class="p-3 text-left font-bold text-slate-200">${tramo.segmento}</td>
                        <td class="p-3 text-slate-400 text-[10px] uppercase font-bold tracking-tight">${tramo.tipoPoste}</td>
                        <td class="p-3">
                            <input type="number" value="${tramo.total}" min="1" 
                                oninput="actualizarTotalTramo(${index}, this.value)" 
                                class="w-16 p-1 text-center font-bold rounded bg-slate-900 border border-white/10 text-white focus:border-blue-500 font-mono no-print">
                            <span class="hidden print-only">${tramo.total}</span>
                        </td>
                        <td class="p-3">
                            <input type="number" value="${tramo.pintados}" min="0" max="${tramo.total}" 
                                oninput="actualizarPintadosTramo(${index}, this.value)" 
                                class="w-16 p-1 text-center font-bold rounded bg-slate-900 border border-white/10 text-emerald-400 focus:border-blue-500 font-mono no-print">
                            <span class="hidden print-only">${tramo.pintados}</span>
                        </td>
                        <td class="p-3 font-mono font-bold text-amber-500">${pendientes}</td>
                        <td class="p-3 text-slate-300 font-mono text-[11px]">${basePintura} Gal <span class="text-[9px] text-slate-500 block uppercase font-sans font-bold">${lblBase}</span></td>
                        <td class="p-3 text-slate-300 font-mono text-[11px]">${contrastePintura} Gal <span class="text-[9px] text-slate-500 block uppercase font-sans font-bold">${lblContraste}</span></td>
                        <td class="p-3 text-slate-300 font-mono font-bold">${tramo.pintados > 0 ? brochas : 0} Und</td>
                        <td class="p-3 text-right font-mono font-black ${pct === 100 ? 'text-emerald-400' : 'text-blue-400'}">${pct}%</td>
                        <td class="p-3 text-center no-print">
                            <button onclick="eliminarTrayecto(${tramo.id})" class="text-slate-600 hover:text-red-400 transition-all">
                                <i class="fa-solid fa-trash-can"></i>
                            </button>
                        </td>
                    </tr>
                `;
            });

            document.getElementById('global-alumbrado-postes').innerText = gAlumbrado;
            document.getElementById('global-baja-postes').innerText = gBaja;
            document.getElementById('global-pintados').innerText = gPintados;
            document.getElementById('global-pendientes').innerText = gPendientes;
            document.getElementById('global-porcentaje').innerText = gTotal > 0 ? `${Math.round((gPintados / gTotal) * 100)}%` : `0%`;

            document.getElementById('global-gal-naranja').innerText = galNaranja + " Gal";
            document.getElementById('global-gal-azul').innerText = galAzul + " Gal";
            document.getElementById('global-gal-aluminio').innerText = galAluminio + " Gal";
            document.getElementById('global-gal-negro').innerText = galNegro + " Gal";
            document.getElementById('global-gal-total').innerText = (galNaranja + galAzul + galAluminio + galNegro) + " Gal";
        }

        function actualizarTotalTramo(index, valor) {
            let val = parseInt(valor) || 1;
            tramosPostes[index].total = val;
            if (tramosPostes[index].pintados > val) tramosPostes[index].pintados = val;
            calcularYRenderizarPostes();
        }

        function actualizarPintadosTramo(index, valor) {
            let val = parseInt(valor) || 0;
            if(val > tramosPostes[index].total) val = tramosPostes[index].total;
            tramosPostes[index].pintados = val;
            calcularYRenderizarPostes();
        }

        function renderizarObras() {
            const contenedor = document.getElementById('contenedor-obras');
            contenedor.innerHTML = "";

            proyectosObras.forEach((obra, oIdx) => {
                let completadas = obra.micros.filter(m => m.cumplido).length;
                let totalMicros = obra.micros.length;
                let pctObra = totalMicros > 0 ? Math.round((completadas / totalMicros) * 100) : 0;
                let esLogroFinal = completadas === totalMicros && totalMicros > 0;

                let htmlMicros = obra.micros.map((m, mIdx) => `
                    <div class="flex items-center justify-between p-2.5 ${m.cumplido ? 'bg-emerald-500/10 border-emerald-500/20 text-emerald-400' : 'bg-black/20 border-white/5 text-slate-200'} rounded-xl border transition-all hover:border-white/10">
                        <div class="flex items-center gap-3">
                            <input type="checkbox" ${m.cumplido ? 'checked' : ''} 
                                onclick="alternarMicroActividad(${oIdx}, ${mIdx})" 
                                class="w-4 h-4 rounded border-white/10 bg-slate-900 text-emerald-600 focus:ring-0 cursor-pointer">
                            <span class="text-xs font-medium">${m.nombre}</span>
                        </div>
                        <button onclick="eliminarMicroActividad(${oIdx}, ${mIdx})" class="text-slate-600 hover:text-red-400 p-1 no-print">
                            <i class="fa-solid fa-xs fa-trash-can"></i>
